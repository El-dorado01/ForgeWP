name: Release to npm

# Publishes the ForgeWP packages from main with npm trusted publishing: GitHub
# proves to npm which repository and workflow is publishing, so no npm token
# is stored anywhere. Start it from the Actions tab: Release to npm → Run
# workflow. Leave "Dry run" ticked to check what would be published.
#
# One-time setup per package on npmjs.com (Package → Settings → Trusted
# publishing → GitHub Actions): owner El-dorado01, repository ForgeWP,
# workflow release.yml. See scripts/release/README.md.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run: show what would be published, publish nothing'
        type: boolean
        default: true
      direct:
        description: 'Publish directly (needs the "npm publish" permission on npm). Unticked: stage for approval on npmjs.com'
        type: boolean
        default: false

permissions:
  contents: write # create the release tag
  id-token: write # npm trusted publishing (OIDC) and provenance

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
          registry-url: 'https://registry.npmjs.org'
      # Trusted publishing needs npm 11.5.1 or newer.
      - run: npm install -g npm@11.21.1
      - run: npm install -g pnpm@10.34.9
      - run: pnpm install --frozen-lockfile

      - name: Checks before publishing
        run: |
          pnpm typecheck
          pnpm --filter @forgewp/compiler test

      - name: Publish new versions
        id: publish
        env:
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
          PUBLISH_MODE: ${{ inputs.direct && 'direct' || 'stage' }}
        run: node scripts/release/publish.mjs

      # Tags the commit that introduced the compiler's current version (the
      # release commit), not whatever is newest on main. Also runs when nothing
      # new was published, so a release published by hand gets its tag too.
      - name: Tag the release
        if: ${{ !inputs.dry_run }}
        env:
          TAG: ${{ steps.publish.outputs.tag }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
            echo "Tag $TAG already exists"
            exit 0
          fi
          VERSION="${TAG#v}"
          COMMIT=$(git log --reverse --format=%H -S"\"version\": \"$VERSION\"" -- packages/compiler/package.json | head -1)
          if [ -z "$COMMIT" ]; then
            echo "Could not find the commit that set version $VERSION"; exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" "$COMMIT" -m "ForgeWP release $TAG"
          git push origin "$TAG"
          echo "Tagged $TAG at $COMMIT" | tee -a "$GITHUB_STEP_SUMMARY"
