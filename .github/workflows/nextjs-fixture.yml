name: Next.js research fixture

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'projects/nextjs-adapter-fixture/**'
      - 'packages/react/**'
      - 'packages/compiler/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/nextjs-fixture.yml'
  push:
    branches: [main]
    paths:
      - 'projects/nextjs-adapter-fixture/**'
      - 'packages/react/**'
      - 'packages/compiler/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/nextjs-fixture.yml'

permissions:
  contents: read

jobs:
  nextjs-fixture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
      - run: npm install -g pnpm@10.34.9
      - run: pnpm install --frozen-lockfile
      - name: Shared block compiler contract
        run: pnpm --filter @forgewp/compiler exec vitest run test/blocks/nextjs-fixture.test.js
      - name: Build ordinary Next.js fixture
        run: pnpm --filter @forgewp/nextjs-adapter-fixture build
      - name: Check route and asset output
        run: pnpm --filter @forgewp/nextjs-adapter-fixture check:next-output
      - name: Compare rendering approaches
        run: pnpm --filter @forgewp/nextjs-adapter-fixture check:renderers
      - name: Check local editing and navigation in Chrome
        run: pnpm --filter @forgewp/nextjs-adapter-fixture check:browser
      - name: Upload research evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nextjs-research-evidence
          include-hidden-files: true
          path: |
            .forgewp/nextjs-browser/
            projects/nextjs-adapter-fixture/.forgewp/renderer-comparison.json
            projects/nextjs-adapter-fixture/.forgewp/*-render-probe.html
