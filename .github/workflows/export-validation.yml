name: Export Validation

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate-export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
      - name: Install pnpm
        run: npm install -g pnpm@10
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run export fixture validation
        run: pnpm --filter @forgewp/compiler test:export-fixture

      - name: Run compiler adapter runtime tests
        run: pnpm --filter @forgewp/compiler run test:adapter-runtime

      - name: Run compiler adapter type tests
        run: pnpm --filter @forgewp/compiler run test:adapter-types
