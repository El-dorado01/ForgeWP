name: Parity (native vs decoupled)

# Phase D (R6): the same project exported as a native theme and run as a
# decoupled Next.js app against one WordPress must agree. See scripts/parity/.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'packages/react/**'
      - 'packages/compiler/**'
      - 'projects/parity-fixture/**'
      - 'scripts/parity/**'
      - 'scripts/cloud-e2e/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/parity.yml'
  push:
    branches: [main]
    paths:
      - 'packages/react/**'
      - 'packages/compiler/**'
      - 'projects/parity-fixture/**'
      - 'scripts/parity/**'
      - 'scripts/cloud-e2e/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/parity.yml'

permissions:
  contents: read

jobs:
  parity:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      FORGEWP_E2E_DATA: ${{ runner.temp }}/e2e
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
      - run: npm install -g pnpm@10.34.9
      - run: pnpm install --frozen-lockfile
      - name: Install Chromium for Playwright
        run: pnpm --filter @forgewp/parity-fixture exec playwright install --with-deps chromium
      - name: Pull WordPress images
        run: docker compose -f scripts/cloud-e2e/docker-compose.yml --profile cli pull --quiet
      - name: Native export + decoupled run + compare
        env:
          PARITY_RESET: '1'
          PARITY_REPORT: ${{ github.workspace }}/.forgewp/parity/report.json
        run: scripts/parity/run.sh
      - name: Upload parity report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parity-report
          include-hidden-files: true
          path: .forgewp/parity/
