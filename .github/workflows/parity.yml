name: Parity (native vs decoupled)

# Phase D (R6): the same project exported as a native theme and run as a
# decoupled Next.js app against one WordPress must agree. See scripts/parity/.

on:
  workflow_dispatch:
  # Nightly on main (02:17 UTC): catches failures that only show up some of the
  # time (timing, slow start-up) and changes in WordPress or WooCommerce
  # downloads, on days without a push. GitHub emails the repository's admins
  # when a scheduled run fails.
  schedule:
    - cron: '17 2 * * *'
  pull_request:
    paths:
      - 'packages/react/**'
      - 'packages/compiler/**'
      - 'projects/parity-fixture/**'
      - 'scripts/parity/**'
      - 'scripts/cloud-e2e/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/parity.yml'
  push:
    branches: [main]
    paths:
      - 'packages/react/**'
      - 'packages/compiler/**'
      - 'projects/parity-fixture/**'
      - 'scripts/parity/**'
      - 'scripts/cloud-e2e/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/parity.yml'

permissions:
  contents: read

jobs:
  parity:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
      - run: npm install -g pnpm@10.34.9
      - run: pnpm install --frozen-lockfile
      - name: Install Chromium for Playwright
        run: pnpm --filter @forgewp/parity-fixture exec playwright install --with-deps chromium
      - name: Pull WordPress images
        run: docker compose -f scripts/cloud-e2e/docker-compose.yml --profile cli pull --quiet
      - name: Native export + decoupled run + compare
        env:
          PARITY_RESET: '1'
          # R7 / Q6: WooCommerce from its GitHub release + a small store, for the commerce checks.
          PARITY_WOOCOMMERCE: '1'
          PARITY_REPORT: ${{ github.workspace }}/.forgewp/parity/report.json
        # The runner context is not available in job-level env, so the data dir is set here.
        run: FORGEWP_E2E_DATA="$RUNNER_TEMP/e2e" scripts/parity/run.sh
      - name: Upload parity report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parity-report
          include-hidden-files: true
          path: .forgewp/parity/
